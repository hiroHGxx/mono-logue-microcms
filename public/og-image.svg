<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182CE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#63B3ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182CE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="60" fill="rgba(255,255,255,0.05)"/>
  <rect x="950" y="50" width="200" height="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="50" y="500" width="300" height="2" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Main Icon -->
  <circle cx="300" cy="315" r="80" fill="url(#iconGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <text x="300" y="340" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="60" font-weight="bold">M</text>
  
  <!-- Main Title -->
  <text x="450" y="280" fill="white" font-family="Arial, sans-serif" font-size="72" font-weight="bold">Mono-Logue</text>
  
  <!-- Subtitle -->
  <text x="450" y="330" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="32" font-weight="normal">〜技術と日常をつなぐブログ〜</text>
  
  <!-- Description -->
  <text x="450" y="390" fill="#CBD5E0" font-family="Arial, sans-serif" font-size="24">プログラマー・3児の父・ヒロが書く</text>
  <text x="450" y="425" fill="#CBD5E0" font-family="Arial, sans-serif" font-size="24">技術と暮らしの気づきを記録するブログ</text>
  
  <!-- Bottom accent -->
  <rect x="450" y="460" width="120" height="4" fill="#3182CE" rx="2"/>
</svg>